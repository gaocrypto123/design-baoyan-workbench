<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
h1,h2,h3,.num{font-family:var(--serif);font-weight:600}
h1{font-size:26px;margin:0}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 10px}
p{margin:0 0 8px}
a{color:var(--blue-d)}
/* top */

.brow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.badge{display:inline-block;font-family:var(--sans);font-size:12px;font-weight:500;color:#fff;background:var(--blue-d);border-radius:20px;padding:3px 12px;letter-spacing:.5px}
.sub{color:var(--ink2);font-size:13px;margin-top:6px}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--sans);font-size:13px;cursor:pointer;border:1px solid var(--blue-m);background:#fff;color:var(--blue-d);border-radius:8px;padding:7px 13px;transition:.15s}
button:hover{background:var(--blue-l);border-color:var(--blue)}
button.pri{background:var(--blue-d);color:#fff;border-color:var(--blue-d)}
button.pri:hover{background:#3C5A6C}
button.sm{padding:4px 9px;font-size:12px}
.danger{border-color:#D9C3C1;color:var(--red)}
.danger:hover{background:#FBEFEE}
/* tabs */
.tabs{position:sticky;top:0;z-index:9;background:rgba(242,245,249,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;padding-top:10px;padding-bottom:10px;overflow-x:auto}
.tab{border:none;background:transparent;color:var(--ink2);padding:8px 15px;border-radius:8px;font-size:14px;white-space:nowrap}
.tab:hover{background:var(--blue-l);color:var(--blue-d)}
.tab.on{background:var(--blue-d);color:#fff}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0}
.card>h2{border-left:4px solid var(--blue-d);padding-left:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
/* metric */
.metric{background:#FAFCFE;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.metric .lb{font-size:12px;color:var(--ink2);letter-spacing:.5px}
.metric .vl{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.2;margin-top:2px}
.metric .un{font-size:13px;color:var(--ink3);font-family:var(--sans)}
/* quote */

.quote small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink2);margin-top:6px;font-weight:400}
/* form */
label.f{display:block}
label.f .t{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-m);outline-offset:0;border-color:var(--blue)}
textarea{min-height:60px;resize:vertical}
.field{display:flex;flex-direction:column}
/* table */
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-weight:500;color:var(--ink2);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:5px 8px;border-bottom:1px solid #F0F4F8;vertical-align:top}
.tb td input,.tb td select{padding:5px 8px}
.tb .r{width:74px}
.tb .r2{width:96px}
.tbwrap{overflow-x:auto}
.delete{border:none;background:transparent;color:var(--ink3);padding:4px 6px;font-size:15px;line-height:1}
.delete:hover{color:var(--red);background:transparent}
/* ring */
.ring{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto}
.ring .n{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1}
.ring .l{font-size:12px;color:var(--ink2);margin-top:4px}
/* bar */
.bar{height:9px;background:#EAEFF4;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed #EDF1F5}
.kv:last-child{border:none}
.kv b{font-weight:500}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--blue-l);color:var(--blue-d)}
.pill.ok{background:#E7F0E9;color:#3F6B4C}
.pill.warn{background:#F6EEDC;color:#8A6A2C}
.pill.bad{background:#F7E7E5;color:#8E4A45}
.note{font-size:12px;color:var(--ink2);background:#F7F9FB;border-radius:8px;padding:9px 12px;margin-top:10px}
.sep{height:1px;background:var(--line);margin:18px 0}
ul.ck{list-style:none;margin:0;padding:0}
ul.ck li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #F0F4F8;align-items:flex-start}
ul.ck li:last-child{border:none}
ul.ck input{margin-top:4px;width:15px;height:15px;accent-color:var(--blue-d);flex:none}

footer{color:var(--ink3);font-size:12px;text-align:center;padding:10px 0 0}
.hint{font-size:12px;color:var(--ink2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
@media print{

</style>

function importPolicy(text){

  if(!p||!p.weights) { alert('文件里没找到 weights（权重）字段。'); return; }
  var np={id:uid(),name:p.name||('导入政策 '+S.policies.length),
    weights:{study:num(p.weights.study)||70,research:num(p.weights.research)||10,contest:num(p.weights.contest)||15,other:num(p.weights.other)||5},
    gpaMap:(p.gpaMap&&p.gpaMap.length)?p.gpaMap:JSON.parse(JSON.stringify(S.gpaMap)),
    tiers:(p.tiers&&p.tiers.length)?p.tiers:JSON.parse(JSON.stringify(S.tiers))};
  S.policies.push(np); S.curPolicyId=np.id;
  S.weights=np.weights; S.gpaMap=np.gpaMap; S.tiers=np.tiers;
  save(); render(); alert('已导入政策「'+np.name+'」，共 '+np.tiers.length+' 条加分档位。');
}
/* 把一段政策公文文本，抽出权重 + 加分档位 */
function policyImport(){ var el=document.getElementById('polFile'); if(el) el.click(); }
function onPolFile(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){ importPolicy(String(fr.result)); };
  fr.readAsText(f,'utf-8');
  ev.target.value='';
}
function parsePolicyText(raw){
  var txt=String(raw).replace(/％/g,'%').replace(/\r/g,'').replace(/\u3000/g,' ');
  var lines=txt.split('\n').map(function(s){return s.replace(/\s+/g,' ').trim()}).filter(function(s){return s.length>3});
  var CATS=[['竞赛',['互联网+','挑战杯','竞赛','大赛','挑战赛','艺术展演','数学建模','蓝桥杯']],
            ['论文',['SCI','SSCI','EI','SCD','CSCD','CSSCI','A&HCI','北大核心','核心','期刊','论文']],
            ['专利',['专利','知识产权']],
            ['大创',['大创','创新创业训练','创新训练','立项']],
            ['志愿',['志愿','志愿服务']],
            ['参军',['参军','退役','服役','兵役']],
            ['国际组织',['国际组织','实习']]];
  var tiers=[],seen={};
  for(var li=0;li<lines.length;li++){
    var line=lines[li].replace(/^[（(]?\d{1,2}[）).、:：\s]+/,'').trim();
    if(!line||line.length>60) continue;
    var cat='';
    for(var ci=0;ci<CATS.length;ci++){ if(CATS[ci][1].some(function(k){return line.indexOf(k)>=0})){cat=CATS[ci][0];break;} }
    if(!cat) continue;
    var head=line.replace(/(?:\d{1,3}(?:\.\d+)?)(?:\s*\/\s*\d{1,3}(?:\.\d+)?){0,5}[\s\S]*$/,'');
    var m=line.match(/\d{1,3}(?:\.\d+)?(?:\s*\/\s*\d{1,3}(?:\.\d+)?){1,5}/);
    var nums=[];
    if(m){ nums=m[0].split('/').map(function(s){return Number(s.trim())}).filter(function(n){return n>0&&n<=100}); }
    if(!nums.length){ var t=line.match(/(\d{1,3}(?:\.\d+)?)\s*$/); if(t){var v=Number(t[1]); if(v>0&&v<=100) nums=[v];} }
    if(!nums.length) continue;
    var lv=[];
    if(nums.length>=2){
      if(/金/.test(head)&&/银/.test(head)&&/铜/.test(head)) lv=['金奖','银奖','铜奖'];
      else if(/[一二三四五特]\s*\/\s*[一二三四五特]|特等|一等|二等|三等/.test(head)){
        var pairing=/[一二三四五特]\s*\/\s*[一二三四五特]/.test(head);
        var c=pairing?nums.length:((head.match(/[特一二三四五]等/g)||[]).length||nums.length);
        var n=Math.max(1,Math.min(nums.length,c||nums.length));
        lv=[];for(var q2=0;q2<n;q2++) lv.push(['一等','二等','三等','四等','五等'][q2]);
      } else { for(var q3=0;q3<nums.length;q3++) lv.push('第'+(q3+1)+'档'); }
    }else{
      var mm=head.match(/(特等|一等奖|二等奖|三等奖|四等奖|金奖|银奖|铜奖|优秀|立项|结题)/);
      lv=[mm?mm[1]:'待定'];
    }
    for(var k2=0;k2<lv.length;k2++){
      var sc=nums[k2]!=null?nums[k2]:nums[0];
      var key=cat+'|'+lv[k2]+'|'+sc; if(seen[key]) continue; seen[key]=1;
      tiers.push({cat:cat,name:line.slice(0,28),level:lv[k2],score:sc});
    }
  }
  function grab(keys){
    for(var i=0;i<keys.length;i++){
      var re=new RegExp(keys[i]+'[^\\d]{0,16}?(\\d{1,3}(?:\\.\\d+)?)\\s*%?','g'),m2;
      while((m2=re.exec(txt))){ var v=Number(m2[1]); if(v>0&&v<=100) return v; }
    }
    return null;
  }
  var w={study:grab(['学业成绩','加权成绩','学业']),research:grab(['科研成果','科研','论文成果']),
         contest:grab(['学科竞赛','竞赛']),other:grab(['志愿服务','参军','综合素质','全面发展','其他加分'])};
  return {weights:w,tiers:tiers.slice(0,80)};
}

  var r=parsePolicyText(el.value);

  if(!r.tiers.length&&!r.weights.study){ box.innerHTML='<div class="note">没识别出来。常见原因：政策是图片版复制不出文字，或者一段里同时写了好几个奖项。这种情况手工填「加分档位表」更稳。</div>'; return; }
  var h='<h3>识别结果（务必核对，识别仅供参考）</h3><div class="kv"><span>权重</span><b>学业 '+(r.weights.study==null?'?':r.weights.study)+'% · 科研 '+(r.weights.research==null?'?':r.weights.research)+'% · 竞赛 '+(r.weights.contest==null?'?':r.weights.contest)+'% · 其他 '+(r.weights.other==null?'?':r.weights.other)+'%</b></div>';
  h+='<div class="tbwrap"><table class="tb"><tr><th>类别</th><th>原文片段</th><th>等次</th><th class="r2">分值</th></tr>';
  r.tiers.forEach(function(t,i){
    h+='<tr><td>'+t.cat+'</td><td>'+esc(t.name)+'</td><td>'+t.level+'</td><td><input type="text" id="pq'+i+'" value="'+t.score+'"></td></tr>';
  });
  h+='</table></div><div class="row" style="margin-top:10px">'
   +'<div class="field" style="flex:1;min-width:180px"><span class="t">这套政策叫什么（建议：学校名+年份）</span><input type="text" id="pqName" value=""></div>'

function applyParsed(){
  var r=window.__parsed; if(!r) return;
  var tid=document.getElementById('pq0');
  var tb=document.getElementById('parseOut');
  var last=0;
  if(tb){var ins=tb.querySelectorAll('input[id^=pq]'); last=ins.length;}
  var tiers=r.tiers.map(function(t,i){
    var val=(i<last)?(Number(document.getElementById('pq'+i)&&document.getElementById('pq'+i).value)||t.score):t.score;
    return {id:uid(),cat:t.cat,name:t.name,level:t.level,score:val};
  });
  var w=r.weights, wsum=0;
  ['study','research','contest','other'].forEach(function(k){ if(w[k]!=null) wsum+=Number(w[k]); });
  if(wsum>0){
    S.weights={study:(w.study==null?Math.round(S.weights.study):w.study),
               research:(w.research==null?Math.round(S.weights.research):w.research),
               contest:(w.contest==null?Math.round(S.weights.contest):w.contest),
               other:(w.other==null?Math.round(S.weights.other):w.other)};
  }
  var nameEl=document.getElementById('pqName'); var nm=(nameEl&&nameEl.value.trim())||('识别政策 '+S.policies.length);
  S.policies.push({id:uid(),name:nm,weights:S.weights,gpaMap:JSON.parse(JSON.stringify(S.gpaMap)),tiers:tiers});
  S.curPolicyId=S.policies[S.policies.length-1].id;
  S.tiers=tiers; save(); render();
  alert('已应用「'+nm+'」，共 '+tiers.length+' 条档位。去「③ 加分台账」把奖状记进来就会自动折分了。');
}

/* ============ 计算 ============ */
function gpaOf(sc){
  sc=Number(sc); if(isNaN(sc))return 0;
  for(var i=0;i<S.gpaMap.length;i++){ if(sc>=S.gpaMap[i][0]) return S.gpaMap[i][1]; }
  return 0;
}
function rankFactor(pos,total){
  pos=Number(pos)||1; total=Number(total)||1;
  if(total<=2) return pos===1?2/3:1/3;
  return 1/Math.pow(2,pos);
}
function tierOf(id){ for(var i=0;i<S.tiers.length;i++) if(S.tiers[i].id===id) return S.tiers[i]; return null; }
function awardScore(a){
  var t=tierOf(a.tierId);
  var base=(t?Number(t.score):Number(a.custom)||0);
  if(!t) return base;
  return base*rankFactor(a.pos,a.total);
}
function sumKind(list){ var s=0; for(var i=0;i<list.length;i++) s+=awardScore(list[i]); return s; }
function calc(){
  var cr=0,cw=0,i;
  for(i=0;i<S.courses.length;i++){var c=S.courses[i];var g=Number(c.credit)||0,h=gpaOf(c.score);cr+=g*h;cw+=g;}
  var gpa=cw>0?cr/cw:0;
  var studyStd=(Number(S.meta.maxGpa)>0)?(gpa/Number(S.meta.maxGpa))*100:0;
  var as=S.awards;
  var rs=Math.min(100,sumKind(as.filter(function(a){return a.kind==='论文'||a.kind==='专利'||a.kind==='大创';})));
  var cs=Math.min(100,sumKind(as.filter(function(a){return a.kind==='竞赛';})));
  var os=Math.min(100,sumKind(as.filter(function(a){return a.kind==='志愿'||a.kind==='参军'||a.kind==='国际组织';})));
  var w=S.weights, wsum=(Number(w.study)||0)+(Number(w.research)||0)+(Number(w.contest)||0)+(Number(w.other)||0)||100;
  var total=(studyStd*(Number(w.study)||0)+rs*(Number(w.research)||0)+cs*(Number(w.contest)||0)+os*(Number(w.other)||0))/wsum;
  var rank=Number(S.meta.rankNow), tgt=Number(S.meta.targetRank), size=Number(S.meta.classSize);
  var safe='—',cls='';
  if(rank&&tgt){
    if(rank<=tgt*0.6){safe='稳';cls='ok';} else if(rank<=tgt){safe='安全';cls='ok';} else if(rank<=tgt*1.5){safe='边缘';cls='warn';} else {safe='偏危险';cls='bad';}
  }
  var tl=S.timeline, tdone=tl.filter(function(x){return x.done}).length;
  var book=S.portfolio.filter(function(x){return x.status==='已入册'}).length;
  var invited=S.apply.filter(function(x){return x.invited==1||x.invited===true||x.invited==='是'}).length;
  var applied=S.apply.filter(function(x){return x.date}).length;
  return {gpa:gpa,studyStd:studyStd,rs:rs,cs:cs,os:os,total:total,safe:safe,cls:cls,tdone:tdone,tl:tl.length,book:book,applied:applied,invited:invited};
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(v,d){v=Number(v);return isNaN(v)?(d||0):v}
function f1(v){return (Math.round(v*100)/100).toFixed(2)}

  +'</div>'
  +'<div class="card"><h2>综合得分怎么来的</h2>'

      +'<td><input type="text" data-k="apply.'+i+'.date" value="'+esc(a.date)+'" style="width:96px"></td>'
      +'<td><select data-k="apply.'+i+'.invited" onchange="render()">'+opts(['','是','否'],a.invited===1?'是':(a.invited==='否'?'否':''))+'</select></td>'
      +'<td><input type="text" data-k="apply.'+i+'.result" value="'+esc(a.result)+'" style="width:84px"></td>'
      +'<td><input type="text" data-k="apply.'+i+'.form" value="'+esc(a.form)+'"></td>'
      +'<td><input type="text" data-k="apply.'+i+'.q" value="'+esc(a.q)+'"></td>'
      +'<td class="delete"><button class="delete" onclick="delArr(\'apply\','+i+')">×</button></td></tr>';
  });
  h+='</table></div><button class="sm" onclick="addA()">+ 加一所</button>'
   +'<div class="sep"></div><div class="grid g4">'
   +metric('已投递',calc().applied,'所')
   +metric('入营',calc().invited,'所')
   +metric('命中率',(calc().applied?Math.round(calc().invited/calc().applied*100):0)+'%','入营 / 投递')
   +metric('面试复盘',S.apply.filter(function(x){return x.q}).length,'条已记录')
   +'</div>'
   +'<div class="note">结果分四种处理：优营且是梦校就安心；优营但不是梦校继续冲；入营没优营就猛练模拟面试；完全没入营也别气馁，直接进预推免。进组学习、实习、旅游都算正当安排。</div></div>';
  return h;
}

/* ============ 成绩单导入 ============ */
function tcPick(){ var el=document.getElementById('tcFile'); if(el) el.click(); }
function loadPdfJs(){
  return new Promise(function(res,rej){
    if(window.pdfjsLib) return res(true);
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload=function(){ res(true); };
    s.onerror=function(){ rej(new Error('cdn')); };
    document.head.appendChild(s);
  });
}
function pdfToText(arr){
  return loadPdfJs().then(function(){
    return pdfjsLib.getDocument({data:arr}).promise.then(function(doc){
      var n=Math.min(doc.numPages,10), jobs=[];
      for(var i=1;i<=n;i++){
        jobs.push(doc.getPage(i).then(function(p){return p.getTextContent();}).then(function(c){
          var out=[],lastY=null,cur='';
          c.items.forEach(function(it){
            var y=Math.round(it.transform[5]);
            if(lastY!==null&&Math.abs(y-lastY)>3){ out.push(cur.trim()); cur=''; }
            cur+=it.str+(/\s$/.test(it.str)?'':'');
            lastY=y;
          });
          if(cur.trim()) out.push(cur.trim());
          return out.join('\n');
        }));
      }
      return Promise.all(jobs).then(function(r){return r.join('\n');});
    });
  });
}
function onTcFile(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var isPdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
  if(isPdf){
    var fr0=new FileReader();
    fr0.onload=function(){
      var arr=new Uint8Array(fr0.result);
      pdfToText(arr).then(function(txt){
        window.__tcText=txt;
        var el=document.getElementById('tcRaw'); el.value=(txt||'').slice(0,20000);
        doParseTranscript();
      }).catch(function(e){
        alert('这份 PDF 没能抽出文字。\n多半是扫描件（图片版成绩单）。\n\n办法：用浏览器打开这份 PDF → Ctrl+A 复制 → 粘到下面那个框里，或者另存为 txt 再导入。');
      });
    };
    fr0.readAsArrayBuffer(f);
  }else{
    var fr1=new FileReader();
    fr1.onload=function(){
      window.__tcText=String(fr1.result);
      document.getElementById('tcRaw').value=window.__tcText.slice(0,20000);
      doParseTranscript();
    };
    fr1.readAsText(f,'utf-8');
  }
  ev.target.value='';
}
function parseTranscript(raw){
  var lines=String(raw).split('\n').map(function(s){return s.replace(/\s+/g,' ').trim();}).filter(function(s){return s.length>1;});
  var rows=[],seen={},lastTerm='';
  for(var i=0;i<lines.length;i++){
    var L=lines[i].replace(/^[（(]?\d{1,2}[）).、\s]+/,'').trim();
    if(!L||L.length>60) continue;
    var hd=L.match(/20\d{2}\s*[-~至到]\s*\d{2,4}/);
    if(/学期|学年|成绩单|平均|合计|总分|学号|姓名|学分绩点|总学分/.test(L)){
      if(hd) lastTerm=hd[0];
      continue;
    }
    if(hd) lastTerm=hd[0];
    var GRP=/\d+(?:\.\d+)?(?:\s+\d+(?:\.\d+)?){1,3}/g, gm, prev=0;
    while((gm=GRP.exec(L))!==null){
      var seg=gm[0], si2=gm.index;
      var nums=(seg.match(/\d+(?:\.\d+)?/g)||[]).map(Number).filter(function(v){return v>0&&v<=100;});
      if(nums.length<2) continue;
      var score=null,pos=-1;
      for(var k=nums.length-1;k>=0;k--){ if(nums[k]>=40&&nums[k]<=100&&nums[k]>=(score||0)){score=nums[k];pos=k;} }
      if(score===null||pos<1){ score=nums[nums.length-1]; pos=nums.length-1; }
      if(pos<1) continue;
      var credit=nums[pos-1];
      if(credit>30&&pos>=2) credit=nums[pos-2];
      if(credit<=0||credit>30) continue;
      var raw=L.slice(prev,si2).replace(/\s+/g,' ').trim();
      prev=si2+seg.length;
      var name=raw.replace(/\d+(?:\.\d+)?/g,' ').replace(/[（(]\s*[）)]/g,'').replace(/\s+/g,' ').trim();
      name=name.replace(/^[\s\d.\-–—~:：,，、]+/,'').replace(/[，,、;；:：|]+$/,'');
      if(name.length<2) continue;
      if(/^(课程|序号|学分|成绩|总评|平均|学期|学年|合计|专业|类别|编号|名称|总学)$/.test(name)) continue;
      if(!/[\u4e00-\u9fa5A-Za-z]/.test(name)) continue;
      var key=lastTerm+'|'+name+'|'+credit+'|'+score;
      if(seen[key]) continue; seen[key]=1;
      rows.push({term:lastTerm,name:name.slice(0,40),credit:credit,score:score});
    }
  }
  return rows;
}
function doParseTranscript(){
  var el=document.getElementById('tcRaw');
  var txt=(el&&el.value)||window.__tcText||'';
  if(!txt.trim()){ alert('先把成绩单文字弄进来：选 PDF，或者把文字粘到框里。'); return; }
  var rows=parseTranscript(txt);
  if(!rows.length){
    document.getElementById('tcOut').innerHTML='<div class="note">没识别出行。常见原因：这份是扫描件（复制不出文字）、或者一行里有好几个日期数字混在一起。试试手动复制几行粘进来。</div>';
    return;
  }
  window.__tc=rows;
  var h='<h3>识别到 '+rows.length+' 门课（核对一下再导入）</h3>'
   +'<div class="tbwrap"><table class="tb"><tr><th>学期</th><th>课程</th><th class="r">学分</th><th class="r">成绩</th><th class="r">绩点</th><th></th></tr>';
  rows.forEach(function(r,i){
    h+='<tr><td><input type="text" value="'+esc(r.term)+'" oninput="tcSet('+i+',\'term\',this.value)" style="width:120px"></td>'
      +'<td><input type="text" value="'+esc(r.name)+'" oninput="tcSet('+i+',\'name\',this.value)"></td>'
      +'<td><input type="text" value="'+r.credit+'" oninput="tcSet('+i+',\'credit\',this.value)" style="width:56px"></td>'
      +'<td><input type="text" value="'+r.score+'" oninput="tcSet('+i+',\'score\',this.value)" style="width:56px"></td>'
      +'<td id="tcG'+i+'"></td>'
      +'<td class="delete"><button class="delete" onclick="tcDel('+i+')">×</button></td></tr>';
  });
  h+='</table></div><div class="row" style="margin-top:10px">'
   +'<button class="pri" onclick="confirmImportCourses()">确认导入（'+rows.length+' 门）</button>'
   +'<button onclick="document.getElementById(\'tcOut\').innerHTML=\'\'">取消</button>'
   +'<span class="hint">重复的同名课程会自动跳过。</span></div>';
  document.getElementById('tcOut').innerHTML=h;
  updateDerived();
  var box=document.getElementById('tcOut');
  for(var i2=0;i2<rows.length;i2++){ var e=box.querySelector('#tcG'+i2); if(e) e.textContent=f1(gpaOf(rows[i2].score)); }
}
function tcSet(i,k,v){ if(!window.__tc[i])return; window.__tc[i][k]=v; }
function tcDel(i){ if(!window.__tc)return; window.__tc.splice(i,1); doParseTranscript(); }
function confirmImportCourses(){
  if(!window.__tc||!window.__tc.length) return;
  var add=0,skip=0;
  window.__tc.forEach(function(r){
    var dup=S.courses.some(function(c){return c.name===r.name&&c.term===r.term;});
    if(dup){ skip++; return; }
    S.courses.push({id:uid(),term:r.term,name:r.name,credit:Number(r.credit)||0,score:Number(r.score)||0});
    add++;
  });
  window.__tc=[]; save(); render();
  alert('导入完成：新增 '+add+' 门'+(skip?('，跳过重复 '+skip+' 门'):'')+'。');
}

/* ============ 派生数值刷新 ============ */
function updateDerived(){
  var c=calc(),i;
  function set(id,v){var e=document.getElementById(id);if(e)e.innerHTML=v}
  set('o-gpa',f1(c.gpa)); set('o-study',Math.round(c.studyStd)); set('o-cn',S.courses.length);
  set('o-credit',f1(S.courses.reduce(function(a,b){return a+(Number(b.credit)||0)},0)));
  set('o-rs',Math.round(c.rs)); set('o-cs',Math.round(c.cs)); set('o-os',Math.round(c.os)); set('o-total',Math.round(c.total));
  var sb=document.getElementById('sumBox'); if(sb) sb.value=buildSummary();
  for(i=0;i<S.courses.length;i++){var e=document.getElementById('gpacell'+i);if(e)e.textContent=f1(gpaOf(S.courses[i].score));}
  for(i=0;i<S.awards.length;i++){var e2=document.getElementById('awcell'+i);if(e2)e2.textContent=f1(awardScore(S.awards[i]));}
}

/* ============ 事件 ============ */
function setPath(k,v){
  var ks=k.split('.'),o=S;
  for(var i=0;i<ks.length-1;i++)o=o[ks[i]];
  o[ks[ks.length-1]]=v;
}
document.addEventListener('input',function(e){
  var k=e.target.getAttribute('data-k'); if(!k)return;
  setPath(k,e.target.value); save(); updateDerived();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute('data-ck')){
    var id=t.getAttribute('data-id'), arr=t.getAttribute('data-ck');
    for(var i=0;i<S[arr].length;i++){ if(S[arr][i].id===id){S[arr][i].done=t.checked;break;} }
    save(); render(); return;
  }
});
function delArr(name,i){
  var list=S[name].filter(function(_,idx){return idx!==i});
  S[name]=list;
  if(name==='tiers'){ S.awards.forEach(function(a){ if(!tierOf(a.tierId)) a.tierId=''; }); }
  save(); render();
}

/* ============ 存储 ============ */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){
  try{var r=localStorage.getItem(KEY); if(r){S=JSON.parse(r);
    if(!S.policies||!S.policies.length){
      var d=blankState();
      S.policies=d.policies; S.curPolicyId=d.curPolicyId;
      if(!S.tiers||!S.tiers.length) S.tiers=d.tiers;
      if(!S.weights||!S.weights.study) S.weights=d.weights;
      if(!S.gpaMap||!S.gpaMap.length) S.gpaMap=d.gpaMap;
    }
    if(!S.curPolicyId) S.curPolicyId=S.policies[0].id;
    save(); return;}}catch(e){}
  S=blankState();S.demo=false;save();
}
function clearAll(){if(!confirm('会清空当前所有数据（包括示例）。确定？'))return;S=blankState();save();render();}
function loadDemo(){if(!confirm('载入示例数据（上岸学姐的公开经历）。覆盖当前内容？'))return;S=demoState();save();render();}
function loadPreset(kind){
  if(kind==='nfu'){
    if(!confirm('载入「南京林业大学 2024 版」政策模板：学业70% / 科研10% / 竞赛15% / 其他5%，并补齐常用加分档位。将覆盖当前加分档位表，确定？'))return;
    S.tiers=defTiers();
    S.weights={study:70,research:10,contest:15,other:5};
    save();render();
  }else{
    if(!confirm('清空成绩、加分、作品集、材料记录，只保留空的规则表？'))return;
    var old={meta:S.meta,weights:S.weights,gpaMap:S.gpaMap,tiers:S.tiers};
    S=blankState();S.meta=old.meta;S.weights=old.weights;S.gpaMap=old.gpaMap;S.tiers=old.tiers;
    save();render();
    alert('已清空。现在去「② 成绩与绩点」把你的成绩单录进来。');
  }
}
function exportJSON(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='设计保研工作台-备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
